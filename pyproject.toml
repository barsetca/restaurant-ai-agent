[project]
name = "restaurant-ai-agent"
version = "0.1.0"
description = "Restaurant AI Agent backend skeleton"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "fastapi==0.121.3",
    "gspread==6.2.1",
    "langchain-core==1.8.1",
    "langchain-openai==1.8.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "pydantic-settings==2.12.0",
    "psycopg[binary]==3.3.9",
    "python-telegram-bot==22.5",
    "qdrant-client==1.16.2",
    "sqlalchemy[asyncio]==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an explicitly configured external test service"]
