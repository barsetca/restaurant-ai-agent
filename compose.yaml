services:
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://restaurant:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/restaurant
      QDRANT_URL: http://qdrant:6333
      GOOGLE_CREDENTIALS_PATH: /run/secrets/restaurant-ai-agent-dev-bca3ed05c181.json
      THREAD_ID_HMAC_SECRET: ${THREAD_ID_HMAC_SECRET:-}
      THREAD_ID_HMAC_KEY_ID: ${THREAD_ID_HMAC_KEY_ID:-v1}
    volumes:
      - type: bind
        source: ${GOOGLE_CREDENTIALS_PATH:-/dev/null}
        target: /run/secrets/restaurant-ai-agent-dev-bca3ed05c181.json
        read_only: true
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
